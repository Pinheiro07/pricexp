version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: financas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: financas_db
      MYSQL_USER: financas_user
      MYSQL_PASSWORD: financas_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: financas-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password_123
    depends_on:
      - db

  web:
    build: .
    container_name: financas-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    networks:
      - default
      - mailcow-net
    depends_on:
      - db

networks:
  default:
  mailcow-net:
    name: mailcowdockerized_mailcow-network
    external: true

volumes:
  mysql_data:
